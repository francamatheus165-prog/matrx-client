<div class="celestar-menu" id="celestar-menu" data-theme="dark">
    <div class="header">
        <div class="title">
            <span>Matrix Client</span>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="mods">Mods</button>
            <button class="tab" data-tab="settings">Settings</button>
        </div>
        <button class="close" id="celestar-close">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
        </button>
    </div>

    <div class="toolbar">
        <div class="search">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="celestar-search" placeholder="Search...">
        </div>
    </div>

    <div class="mods" id="celestar-mods-panel">
        <div class="card" data-mod="zoom">
            <svg class="card-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                <line x1="11" y1="8" x2="11" y2="14" />
                <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
            <div class="name">Zoom</div>
            <div class="card-btn">
                <button class="toggle-btn" data-toggle="zoom">Disabled</button>
            </div>
        </div>
        <div class="card" data-mod="adblocker">
            <svg class="card-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                <line x1="9" y1="9" x2="15" y2="15" />
                <line x1="15" y1="9" x2="9" y2="15" />
            </svg>
            <div class="name">Ad Blocker</div>
            <div class="card-btn">
                <button class="toggle-btn" data-toggle="adblocker">Disabled</button>
            </div>
        </div>
        <div class="card" data-mod="keystrokes">
            <svg class="card-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2" />
                <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
            </svg>
            <div class="name">Keystrokes</div>
            <div class="card-btn">
                <button class="toggle-btn" data-toggle="keystrokes">Disabled</button>
            </div>
        </div>
    </div>

    <div id="celestar-settings-panel">
        <div class="setting-row">
            <label>Auto Fullscreen</label>
            <div class="opt-toggle">
                <input type="checkbox" id="client-autofullscreen-btn">
                <label for="client-autofullscreen-btn"></label>
            </div>
        </div>
        <div class="setting-row">
            <label>Menu Keybind</label>
            <div class="keybind-box" id="client-keybind-btn"></div>
        </div>
        <div class="setting-row">
            <label>URL</label>
            <div class="site-buttons">
                <button class="site-btn active" id="btn-main">minefun.io</button>
                <button class="site-btn" id="btn-sandbox">sandbox.minefun.io</button>
            </div>
        </div>
    </div>
</div>
